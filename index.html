<title>Quiz do Clube Leão</title>
<style>
:root{--bg:#e3f0ff;--card:#fff;--ink:#14213d;--mut:#5b6478;--gold:#c98a00;--line:#d9d4c7;--ok:#1b7f3b;--no:#b3261e;--btn:#14213d;--btnt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#16223a;--ink:#f1ede2;--mut:#a5afc4;--gold:#f0b429;--line:#2c3b5c;--ok:#5fd18a;--no:#ff8a80;--btn:#f0b429;--btnt:#14213d}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#16223a;--ink:#f1ede2;--mut:#a5afc4;--gold:#f0b429;--line:#2c3b5c;--ok:#5fd18a;--no:#ff8a80;--btn:#f0b429;--btnt:#14213d}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:18px/1.5 Georgia,'Times New Roman',serif;display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:20px 16px 32px}
h1{font-size:26px;line-height:1.2;margin:8px 0 4px}
.sub{color:var(--mut);font-size:15px;margin:0 0 20px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .3s}
.q{font-size:20px;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px;cursor:pointer}
.opt:focus-visible,.go:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 15%,var(--card))}
.msg{min-height:28px;font-weight:bold;margin:6px 0 10px}
.go{font:inherit;font-weight:bold;background:var(--btn);color:var(--btnt);border:0;border-radius:10px;padding:13px 22px;cursor:pointer}
.big{font-size:44px;margin:6px 0}
.lema{color:var(--mut);font-style:italic}
</style></head><body><main id="app"></main>

var app=document.getElementById('app'),i=0,pts=0,done=false;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function show(){
 if(i>=Q.length){return end()}
 var q=Q[i];
 app.innerHTML=LOGO+'<h1>🦁 Quiz do Clube Leão</h1><p class="sub">Pergunta '+(i+1)+' de '+Q.length+' · '+pts+' acertos</p>'+

 q[1].map(function(o,k){return '<button class="opt" data-k="'+k+'">'+esc(o)+'</button>'}).join('')+
 '<div class="msg" id="msg" aria-live="polite"></div>';
 done=false;
 [].forEach.call(app.querySelectorAll('.opt'),function(b){b.onclick=function(){pick(+b.dataset.k)}});
}
function pick(k){
 if(done)return;done=true;
 var q=Q[i],bs=app.querySelectorAll('.opt'),m=document.getElementById('msg');
 bs[q[2]].classList.add('ok');

 else{bs[k].classList.add('no');m.style.color='var(--no)';m.textContent='❌ Errado. A certa é: '+q[1][q[2]]}
 var g=document.createElement('button');g.className='go';g.textContent=i+1<Q.length?'Próxima':'Ver resultado';
 g.onclick=function(){i++;show()};app.appendChild(g);g.focus();
}
function end(){
