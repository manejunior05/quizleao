<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz do Clube Leão</title>
<style>
:root{--bg:#e3f0ff;--card:#fff;--ink:#14213d;--mut:#5b6478;--gold:#c98a00;--line:#d9d4c7;--ok:#1b7f3b;--no:#b3261e;--btn:#14213d;--btnt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#16223a;--ink:#f1ede2;--mut:#a5afc4;--gold:#f0b429;--line:#2c3b5c;--ok:#5fd18a;--no:#ff8a80;--btn:#f0b429;--btnt:#14213d}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#16223a;--ink:#f1ede2;--mut:#a5afc4;--gold:#f0b429;--line:#2c3b5c;--ok:#5fd18a;--no:#ff8a80;--btn:#f0b429;--btnt:#14213d}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:18px/1.5 Georgia,'Times New Roman',serif;display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:20px 16px 32px}
h1{font-size:26px;line-height:1.2;margin:8px 0 4px}
.sub{color:var(--mut);font-size:15px;margin:0 0 20px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .3s}
.q{font-size:20px;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px;cursor:pointer}
.opt:focus-visible,.go:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 15%,var(--card))}
.msg{min-height:28px;font-weight:bold;margin:6px 0 10px}
.go{font:inherit;font-weight:bold;background:var(--btn);color:var(--btnt);border:0;border-radius:10px;padding:13px 22px;cursor:pointer}
.big{font-size:44px;margin:6px 0}
.lema{color:var(--mut);font-style:italic}
</style></head><body><main id="app"></main>
<script>
var Q=[
["Em que mês e ano começou a igreja \"Shekinan\", no bairro de Empantcha?",["Outubro de 2002","Outubro de 2001","Maio de 2006","Janeiro de 2008"],1],
["Quem iniciou a igreja distribuindo folhetos e revistas sobre saúde?",["Betchi Sanha e Midana Gomes","Inocêncio Alves e Zanzário Mané","Arlindo Gomes e Samuel Cá","Rodrigo Assi e César"],2],
["Em que mês e ano foi fundado o Clube de Desbravadores?",["Outubro de 2001","Maio de 2006","Outubro de 2002","Outubro de 2014"],2],
["Qual era o objetivo de fundar o clube?",["Ganhar campeonatos","Conservar os membros batizados da igreja","Distribuir folhetos de saúde","Organizar olimporis"],1],
["Quem apoiou o Arlindo em 2003, quando o Samuel Cá foi estudar?",["Inocêncio Alves","Betchi Sanha","Midana Gomes","Junior Mané"],0],
["Em que data o clube realizou a sua primeira investidura?",["6 de Maio de 2006","6 de Maio de 2008","Outubro de 2002","2012"],0],
["Quem foi o diretor do clube de 2008 até 2016?",["Midana Gomes","Mário Da Silva","Betchi Sanha","Fernando Forré Jr"],2],
["Em 2012, o clube participou de um olimpori com a unidade Lobo. Que lugar conquistou?",["Primeiro lugar","Segundo lugar","Terceiro lugar","Não ficou classificado"],1],
["Qual unidade masculina ficou em 1º lugar no campeonato de ordem unida 2015?",["Gato","Lobo","Lince Negra","Guipardo"],2],
["Qual unidade feminina ficou em 1º lugar no campeonato de ordem unida 2015?",["Jaguatrica","Gata","Leão","Serval"],0],
["Em 2019, o campeonato de unidades foi organizado por qual pastor?",["Pr. Rodrigo Assi","Pr. Kleber Pires","Pr. Henrique Filzer","Pr. Gaspar Gomes"],1],
["Qual é o lema que os pioneiros dizem que seria o do clube?",["Sempre alerta","O amor de Cristo nos motiva","Até aqui chegamos pela fé","Levar a mensagem ao mundo"],2],
["Quem é o atual diretor do clube Leão (2026)?",[" Casimiro Lópes","Junior Mané","Afonso Costa","carlinho có"],0],
["Em que bairro começou a igreja \"Shekinah\"?",["Q.G","Bissau Velho","Empantcha","Luanda"],2],
["Sobre o que falavam os folhetos e revistas do começo da igreja?",["Música e arte","Saúde e como tratar o lixo","Esportes","Política"],1],
["Quais brasileiros ajudaram no primeiro evangelismo público?",["Rodrigo Assi e Kleber Pires","Henrique Filzer e César","Arlindo Gomes e Samuel Cá","Inocêncio Alves e Zanzário Mané"],1],
["Quem foi o diretor do clube de 2017 a 2018?",["Betchi Sanha","Mário Da Silva","Junior Mané","Midana Gomes"],3],
["Quem organizou o olimpori de 2012?",["Rodrigo Assi","Kleber Pires","Betchi Sanha","Arlindo Gomes"],0],
["O que o clube venceu em 2014?",["Um olimpori","O campeonato de Clubes nacionais","O campeonato de unidades","Uma atividade em Mansoa"],1],
["Qual unidade masculina ficou em 2º lugar no campeonato de ordem unida 2015?",["Lince Negra","Guepardo","Lobo","Gato"],3],
["Em que cidade o clube ficou em 1º lugar numa atividade em 2019?",["Bissau","Mansoa","Gardete","Cacheu"],1],
["Com quantas unidades o clube participou do campeonato de 2019?",["Duas","Quatro","Três","Cinco"],2],
["Quem comandou a primeira investidura junto com Arlindo Gomes?",["Betchi Sanha","Zanzário Mané","Osvaldo H. Neque","Samuel Cá"],1],
["Quem é o atual secretário/a do clube?",["Nadine","Afonso","Delcia","Janice"],1]
];
var app=document.getElementById('app'),i=0,pts=0,done=false;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function show(){
 if(i>=Q.length){return end()}
 var q=Q[i];
 app.innerHTML='<img src="logo.png" alt="Logo do Clube de Desbravadores" style="max-width:110px;display:block;margin:0 auto 8px">'<h1>🦁 Quiz do Clube Leão</h1><p class="sub">Pergunta '+(i+1)+' de '+Q.length+' · '+pts+' acertos</p>'+
 '<div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><p class="q">'+esc(q[0])+'</p>'+
 q[1].map(function(o,k){return '<button class="opt" data-k="'+k+'">'+esc(o)+'</button>'}).join('')+
 '<div class="msg" id="msg" aria-live="polite"></div>';
 done=false;
 [].forEach.call(app.querySelectorAll('.opt'),function(b){b.onclick=function(){pick(+b.dataset.k)}});
}
function pick(k){
 if(done)return;done=true;
 var q=Q[i],bs=app.querySelectorAll('.opt'),m=document.getElementById('msg');
 bs[q[2]].classList.add('ok');
 if(k===q[2]){pts++;m.style.color='var(--ok)';m.textContent='✅ Correto!'}
 else{bs[k].classList.add('no');m.style.color='var(--no)';m.textContent='❌ Errado. A certa é: '+q[1][q[2]]}
 var g=document.createElement('button');g.className='go';g.textContent=i+1<Q.length?'Próxima':'Ver resultado';
 g.onclick=function(){i++;show()};app.appendChild(g);g.focus();
}
function end(){
 var p=pts/Q.length,t=p===1?'🏆 Perfeito! Você conhece toda a história do clube!':p>=.7?'👏 Muito bem! Você conhece bem a história do Leão.':p>=.4?'🙂 Bom começo! Leia a história e tente de novo.':'📖 Vale estudar a história do clube e tentar de novo!';
 app.innerHTML='<img src="logo.png" alt="Logo do Clube de Desbravadores" style="max-width:110px;display:block;margin:0 auto 8px">'<h1>🦁 Resultado final</h1><p class="big">'+pts+' de '+Q.length+'</p><p>'+t+'</p><p class="lema">“Até aqui chegamos pela fé.”</p><button class="go" id="r">Jogar de novo</button>';
 document.getElementById('r').onclick=function(){i=0;pts=0;show()};
}
show();
</script></body></html>
